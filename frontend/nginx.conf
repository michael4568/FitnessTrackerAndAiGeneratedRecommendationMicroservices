server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gateway-service:8080/api/;
        
        # Trick the backend Gateway into thinking this request came from the Vite dev server
        # This prevents CORS errors without needing to change any Java code!
        proxy_set_header Origin "http://localhost:5173";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
