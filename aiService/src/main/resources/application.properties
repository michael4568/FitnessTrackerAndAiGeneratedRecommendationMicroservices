spring.application.name=ai-service
spring.config.import=optional:configserver:http://localhost:8888

# AI Service Rate Limits (per instance/memory reset)
resilience4j.ratelimiter.instances.freeRecommendation.limitForPeriod=2
resilience4j.ratelimiter.instances.freeRecommendation.limitRefreshPeriod=1d
resilience4j.ratelimiter.instances.freeRecommendation.timeoutDuration=0s

resilience4j.ratelimiter.instances.customRecommendation.limitForPeriod=5
resilience4j.ratelimiter.instances.customRecommendation.limitRefreshPeriod=1d
resilience4j.ratelimiter.instances.customRecommendation.timeoutDuration=0s

resilience4j.ratelimiter.instances.freeChat.limitForPeriod=7
resilience4j.ratelimiter.instances.freeChat.limitRefreshPeriod=1d
resilience4j.ratelimiter.instances.freeChat.timeoutDuration=0s

resilience4j.ratelimiter.instances.customChat.limitForPeriod=15
resilience4j.ratelimiter.instances.customChat.limitRefreshPeriod=1d
resilience4j.ratelimiter.instances.customChat.timeoutDuration=0s

# API DDOS Protection limits
resilience4j.ratelimiter.instances.fetchRecommendation.limitForPeriod=100
resilience4j.ratelimiter.instances.fetchRecommendation.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.fetchRecommendation.timeoutDuration=0s