spring.application.name=gateway-service

# Config Client is on classpath but not needed — routes defined locally below
spring.cloud.config.import-check.enabled=false

server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Keycloak JWT verification
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fitness-realm/protocol/openid-connect/certs}

# Gateway Routes — direct localhost (no Eureka lb:// lookup needed)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**

spring.cloud.gateway.routes[1].id=activity-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/activities/**

spring.cloud.gateway.routes[2].id=ai-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/recommendations/**