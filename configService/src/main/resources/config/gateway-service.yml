server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/fitness-realm/protocol/openid-connect/certs}
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        - id: activity-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/activities/**
        - id: ai-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/recommendations/**